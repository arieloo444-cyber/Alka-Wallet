<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .login-image {
            object-fit: cover;
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body class="bg-light overflow-hidden">

    <main class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">
            <div class="col-md-5 d-flex align-items-center justify-content-center bg-white">
                <div class="w-100 p-5" style="max-width: 420px;">
                    <div class="mb-5">
                        <img src="../img/logo.png" alt="Alke Wallet Logo" class="mb-4"
                            style="width: 60px; height: 60px; object-fit: contain;">
                        <h2 class="fw-bold mb-1">Alke Wallet</h2>
                        <p class="text-secondary">Ingresa tus credenciales para continuar.</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-floating mb-4">
                            <input type="email" class="form-control form-control-minimal" id="email"
                                placeholder="nombre@ejemplo.com" required>
                            <label for="email">Correo Electrónico</label>
                        </div>
                        <div class="form-floating mb-5">
                            <input type="password" class="form-control form-control-minimal" id="password"
                                placeholder="********" required>
                            <label for="password">Contraseña</label>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit"
                                class="btn btn-primary btn-lg rounded-pill py-3 shadow-none">Ingresar</button>
                        </div>
                    </form>

                    <div class="mt-4 text-start">
                        <a href="#" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
            </div>

            <div class="col-md-7 d-none d-md-block">
                <img src="../img/hero.png" alt="Digital Banking" class="login-image">
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
