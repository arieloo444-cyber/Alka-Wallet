<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="menu.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Movimientos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row text-center">
            <div class="col-12 mb-4">
                <h2 class="display-6">Bienvenido, <span id="userName">Usuario</span></h2>
                <p class="lead">Tu saldo disponible es:</p>
                <h1 class="display-4 fw-bold text-success">$ <span id="userBalance">0</span></h1>
            </div>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3 hover-effect">
                    <div class="card-body">
                        <i class="bi bi-arrow-down-circle fs-1 text-primary mb-3"></i>
                        <h5 class="card-title">Depositar</h5>
                        <p class="card-text text-muted">Ingresa dinero a tu cuenta.</p>
                        <a href="deposit.html" class="btn btn-outline-primary stretched-link">Ir a Depositar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3 hover-effect">
                    <div class="card-body">
                        <i class="bi bi-send fs-1 text-primary mb-3"></i>
                        <h5 class="card-title">Enviar Dinero</h5>
                        <p class="card-text text-muted">Transfiere a tus contactos.</p>
                        <a href="sendmoney.html" class="btn btn-outline-primary stretched-link">Realizar Envío</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3 hover-effect">
                    <div class="card-body">
                        <i class="bi bi-list-ul fs-1 text-primary mb-3"></i>
                        <h5 class="card-title">Últimos Movimientos</h5>
                        <p class="card-text text-muted">Revisa tu historial.</p>
                        <a href="transactions.html" class="btn btn-outline-primary stretched-link">Ver Historial</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
